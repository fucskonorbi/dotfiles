# ~/.config/tmux/tmux.conf
# Minimal, fast, Catppuccin Mocha themed tmux config.

# --- General ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g status-position top

# flag windows with new output (paired with catppuccin activity icon below)
set -g monitor-activity on
set -g visual-activity off

# prefix: keep default (C-b) — change here if you prefer C-a:
# set -g prefix C-a

# --- Sane splits / reload ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# vim-style pane navigation & resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+number: jump straight to window N, no prefix needed
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# --- Plugins (via TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'omerxx/tmux-sessionx'

# Catppuccin theme options
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_flags "icon"

# continuum: auto restore last session
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# sessionx: fuzzy session/window manager with preview
# prefix+o opens it; Ctrl-w inside toggles to window view w/ preview
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
# TODO: fill in your real project/worktree roots, comma separated
# NOTE: use absolute paths here, not '~' - sessionx's find doesn't expand it
set -g @sessionx-custom-paths '/volumes/cratus-project-root/ws/users/uif40764/dotfiles'
set -g @sessionx-custom-paths-subdirectories 'true'
set -g @sessionx-preview-location 'right'
# delete (kill) the selected session with ctrl-d instead of the default alt-backspace
set -g @sessionx-bind-kill-session 'ctrl-d'
# freed up ctrl-d was "scroll preview down" - move that to alt-j instead
set -g @sessionx-bind-scroll-down 'alt-j'

# --- Statusline layout (populated by catppuccin) ---
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# --- Self-bootstrap TPM on first run ---
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --depth 1 https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# keep this line at the very bottom of tmux.conf
run '~/.config/tmux/plugins/tpm/tpm'
